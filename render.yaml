services:
  - type: web
    name: vaiescolar-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: GPS_RETENTION_DAYS
        value: "30"
      - key: GPS_CLEANUP_BATCH_SIZE
        value: "10000"
