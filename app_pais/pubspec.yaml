name: app_pais
description: App dos pais - mapa ao vivo, timeline e notificacoes push (stack 100% gratuita).
publish_to: "none"
version: 0.3.1+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  google_maps_flutter: ^2.6.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  mobile_scanner: ^5.2.3
  geocoding: ^5.0.0
  geolocator: ^13.0.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  package_info_plus: ^8.1.1
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
    - assets/branding/teco-logo.png
    - assets/branding/teco-icon-light.png
    - assets/branding/teco-icon-dark.png

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F4C5C"
  image: assets/branding/teco-icon-light.png
  image_dark: assets/branding/teco-icon-dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F4C5C"
    image: assets/branding/teco-icon-light.png
    image_dark: assets/branding/teco-icon-dark.png
