name: app_motorista
description: App do motorista - rastreamento em 1o plano de alta precisao (stack 100% gratuita).
publish_to: "none"
version: 1.0.34+4040

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  app_pais:
    path: ../app_pais
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  geolocator: ^13.0.1
  geocoding: ^5.0.0
  flutter_foreground_task: ^8.17.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0
  mask_text_input_formatter: ^2.9.0
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# Splash nativa (gerada com `dart run flutter_native_splash:create`) --
# substitui a splash branca padrao do Flutter enquanto nao existe um
# logotipo definitivo (ver README, secao de identidade visual pendente).
flutter_native_splash:
  color: "#0F6B6B"
  color_dark: "#0E1514"
  android_12:
    color: "#0F6B6B"
    color_dark: "#0E1514"
